<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Agent Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="login-panel" class="login-panel">
        <div class="login-copy">
          <p class="eyebrow">Eigi device setup</p>
          <h1>Voice Agent Dashboard</h1>
          <p class="subtle">
            Configure WiFi, Bluetooth, API keys, and voice runtime from the
            local device dashboard.
          </p>
        </div>
        <form id="login-form" class="form">
          <label>
            Username
            <input
              id="username"
              autocomplete="username"
              placeholder="Username"
              required
            />
          </label>
          <label>
            Password
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              placeholder="Password"
              required
            />
          </label>
          <button type="submit">Log in</button>
        </form>
        <p id="login-message" class="message"></p>
      </section>

      <section id="dashboard-panel" class="hidden">
        <header class="topbar">
          <div>
            <p class="eyebrow">Local setup</p>
            <h1>Voice Agent Dashboard</h1>
            <p id="local-url" class="subtle"></p>
          </div>
          <button id="logout-button" type="button">Log out</button>
        </header>

        <section class="grid">
          <article class="panel">
            <div class="panel-header">
              <h2>System</h2>
              <button id="refresh-status" type="button">Refresh</button>
            </div>
            <div id="services" class="list"></div>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2>WiFi</h2>
              <button id="scan-wifi" type="button">Scan</button>
            </div>
            <div id="wifi-list" class="list"></div>
            <form id="wifi-form" class="form compact">
              <input id="wifi-ssid" placeholder="SSID" required />
              <input
                id="wifi-password"
                type="password"
                placeholder="Password"
                required
              />
              <button type="submit">Connect</button>
            </form>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2>Bluetooth</h2>
              <button id="scan-bluetooth" type="button">Scan</button>
            </div>
            <div id="bluetooth-list" class="list"></div>
          </article>

          <article class="panel">
            <h2>Password</h2>
            <form id="password-form" class="form compact">
              <input id="password-username" placeholder="Username" required />
              <input
                id="current-password"
                type="password"
                placeholder="Current password"
                required
              />
              <input
                id="new-password"
                type="password"
                placeholder="New password"
                required
              />
              <button type="submit">Change password</button>
            </form>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2>Voice Runtime</h2>
              <button id="load-agents" type="button">Load agents</button>
            </div>
            <form id="remote-voice-form" class="form compact">
              <label>
                Runtime
                <select id="runtime-mode" required>
                  <option value="local">Local voice bot</option>
                  <option value="remote_daily">Eigi voice bot</option>
                </select>
              </label>
              <label>
                Eigi API base
                <input
                  id="public-api-base-url"
                  placeholder="http://localhost:4000/v1/public"
                  required
                />
              </label>
              <input
                id="daily-session-url"
                placeholder="http://localhost:4000/v1/public/daily"
                required
              />
              <label>
                Agent
                <select id="agent-select">
                  <option value="">Load agents from Eigi</option>
                </select>
              </label>
              <input id="eigi-agent-id" placeholder="Agent ID" />
              <textarea
                id="dynamic-variables"
                rows="6"
                placeholder='{"patient_name":"Maya"}'
              ></textarea>
              <input
                id="conversation-config-type"
                placeholder="VOICE"
                value="VOICE"
                required
              />
              <label class="inline">
                <input id="is-test-call" type="checkbox" />
                Test call
              </label>
              <input id="native-bin" placeholder="Native binary path" />
              <input id="native-config-file" placeholder="Native config file" />
              <button type="submit">Save voice runtime</button>
            </form>
            <p id="api-key-preview" class="message"></p>
            <div id="dynamic-variable-list" class="list"></div>
          </article>

          <article class="panel">
            <h2>API Keys</h2>
            <form id="api-key-form" class="form compact">
              <input id="eigi-api-key" type="password" placeholder="EIGI_API_KEY" />
              <input
                id="openai-api-key"
                type="password"
                placeholder="OPENAI_API_KEY"
              />
              <input
                id="deepgram-api-key"
                type="password"
                placeholder="DEEPGRAM_API_KEY"
              />
              <input
                id="cartesia-api-key"
                type="password"
                placeholder="CARTESIA_API_KEY"
              />
              <button type="submit">Save API keys</button>
            </form>
            <div id="api-key-status" class="list"></div>
          </article>
        </section>
        <p id="app-message" class="message"></p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
