<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Agent Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section id="login-panel" class="panel">
        <h1>Voice Agent Dashboard</h1>
        <form id="login-form" class="form">
          <label>
            Username
            <input id="username" autocomplete="username" value="admin" required />
          </label>
          <label>
            Password
            <input id="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Log in</button>
        </form>
        <p id="login-message" class="message"></p>
      </section>

      <section id="dashboard-panel" class="hidden">
        <header class="topbar">
          <div>
            <h1>Voice Agent Dashboard</h1>
            <p id="local-url"></p>
          </div>
          <button id="logout-button" type="button">Log out</button>
        </header>

        <section class="grid">
          <article class="panel">
            <div class="panel-header">
              <h2>System</h2>
              <button id="refresh-status" type="button">Refresh</button>
            </div>
            <div id="services" class="list"></div>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2>WiFi</h2>
              <button id="scan-wifi" type="button">Scan</button>
            </div>
            <div id="wifi-list" class="list"></div>
            <form id="wifi-form" class="form compact">
              <input id="wifi-ssid" placeholder="SSID" required />
              <input id="wifi-password" type="password" placeholder="Password" required />
              <button type="submit">Connect</button>
            </form>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2>Bluetooth</h2>
              <button id="scan-bluetooth" type="button">Scan</button>
            </div>
            <div id="bluetooth-list" class="list"></div>
          </article>

          <article class="panel">
            <h2>Password</h2>
            <form id="password-form" class="form compact">
              <input id="password-username" value="admin" required />
              <input id="current-password" type="password" placeholder="Current password" required />
              <input id="new-password" type="password" placeholder="New password" required />
              <button type="submit">Change password</button>
            </form>
          </article>
        </section>
        <p id="app-message" class="message"></p>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
